<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Sweety 🎀</title>
    <style>
        :root { --pookie: #ff4d6d; --soft: #ffb3c1; --light: #fff0f3; --grey: #cccccc; --gold: #d4af37; }
        
        body {
            margin: 0; height: 100vh; display: flex; justify-content: center; 
            align-items: center; background: radial-gradient(circle, var(--light) 0%, #ffdde1 100%);
            font-family: 'Comic Sans MS', cursive, sans-serif; overflow: hidden; color: var(--pookie);
        }

        .card {
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px);
            padding: 25px; border-radius: 40px; text-align: center;
            border: 4px solid white; box-shadow: 0 15px 30px rgba(255, 77, 109, 0.2);
            z-index: 10; width: 85%; max-width: 420px; transition: 1s ease;
        }

        /* Buttons */
        #unlock-btn {
            background: var(--grey); color: white; border: none;
            padding: 12px 25px; border-radius: 50px; font-weight: bold;
            margin-top: 15px; cursor: not-allowed; transition: all 0.5s ease;
        }
        #unlock-btn.active { background: var(--pookie); cursor: pointer; animation: glow 1.5s infinite; }
        @keyframes glow { 0%, 100% { box-shadow: 0 0 5px #ff4d6d; transform: scale(1); } 50% { box-shadow: 0 0 20px #ff4d6d; transform: scale(1.05); } }

        /* Photo Frame */
        #photo-frame {
            display: none; position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 280px; padding: 15px 15px 45px 15px; background: white;
            border-radius: 5px; box-shadow: 0 30px 60px rgba(255, 77, 109, 0.4);
            z-index: 100; border: 1px solid #ddd;
            transition: all 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #photo-frame.open { display: block; transform: translate(-50%, -50%) scale(1) rotate(-2deg); }
        #photo-frame.diminish { transform: translate(-50%, -50%) scale(0) rotate(10deg); opacity: 0; }
        #photo-frame img { width: 100%; height: 260px; object-fit: cover; border-radius: 2px; }

        /* Game Area */
        #game-area { margin-top: 15px; background: white; border: 2px solid var(--soft); border-radius: 20px; height: 110px; position: relative; overflow: hidden; }
        .game-heart { position: absolute; font-size: 1.8rem; cursor: pointer; z-index: 20; }

        /* Dropping Words Animation */
        #final-message-container {
            margin-top: 25px; font-weight: bold; font-size: 1.1rem;
            display: flex; justify-content: center; flex-wrap: wrap; gap: 8px;
        }
        .word { display: inline-block; opacity: 0; transform: translateY(-100px); transition: color 1s; }
        .drop { animation: wordDrop 0.8s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes wordDrop { to { opacity: 1; transform: translateY(0); } }
        .gold-sparkle { color: #b8860b; text-shadow: 0 0 8px rgba(212, 175, 55, 0.6); }

        /* BLACK FADE OVERLAY */
        #black-out {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: black; opacity: 0; pointer-events: none; z-index: 1000;
            transition: opacity 3s ease-in-out;
        }

        .falling-item { position: fixed; bottom: -10vh; animation: rise linear forwards; z-index: 1; }
        @keyframes rise { to { transform: translateY(-110vh) rotate(360deg); opacity: 0; } }
        #surprise { display: none; opacity: 0; }
    </style>
</head>
<body>

    <div id="black-out"></div>

    <div class="card" id="mainCard">
        <h2 style="margin-bottom: 25px;">Ready for your surprise? 🎀</h2>
        <button onclick="startSurprise()" style="background:var(--pookie); color:white; border:none; padding:15px 35px; border-radius:50px; cursor:pointer; font-weight:bold;">Yes, Pookie! ✨</button>
    </div>

    <div class="card" id="surprise">
        <h1 style="font-size: 2.2rem; margin:0;">Sweety ✨</h1>
        <div id="game-section">
            <div style="font-weight: bold; margin-top:10px;">Love Level: <span id="score">0</span> / 50</div>
            <div id="game-area"><p style="font-size: 0.7rem; color: #ffb3c1; margin-top: 45px;">Catch hearts to reach 50! 🔒</p></div>
        </div>

        <button id="unlock-btn" onclick="openPhoto()" disabled>Button Locked 🔒</button>
        <div id="final-message-container"></div>

        <div style="font-size: 0.75rem; border-top: 1px dashed var(--soft); margin-top: 15px; padding-top: 10px;">
            <p id="daysCount"></p>
            <strong>6 Months Anniversary ♾️</strong>
        </div>
    </div>

    <div id="photo-frame">
        <img src="photo.jpg" alt="Our Memory">
        <div style="font-size: 1.1rem; color: #333; margin-top: 15px; font-style: italic;">My Sweetest Sweety ❤️</div>
    </div>

    <audio id="bgMusic" loop>
        <source src="zara_paas.mp3" type="audio/mpeg">
    </audio>

    <script>
        let score = 0;
        let gameActive = true;
        const finalLine = "This is end of web but not our's";

        function startSurprise() {
            document.getElementById('bgMusic').play();
            document.getElementById('mainCard').style.display = 'none';
            const s = document.getElementById('surprise');
            s.style.display = 'block';
            setTimeout(() => s.style.opacity = "1", 50);
            calculateDays();
            setInterval(() => createEmoji(['✨', '🌸', '🎀'], 'falling-item'), 400);
            setInterval(spawnGameHeart, 800); 
        }

        function spawnGameHeart() {
            if(!gameActive) return;
            const area = document.getElementById('game-area');
            const heart = document.createElement('div');
            heart.innerHTML = '💖';
            heart.className = 'game-heart';
            heart.style.left = Math.random() * 80 + "%";
            heart.style.top = "-50px";
            area.appendChild(heart);
            let pos = -50;
            const fall = setInterval(() => {
                if (pos > 110) { clearInterval(fall); heart.remove(); }
                else { pos += 2.5; heart.style.top = pos + "px"; }
            }, 20);
            heart.onclick = () => {
                score += 5;
                document.getElementById('score').innerHTML = score;
                heart.remove();
                if (score >= 50) {
                    const btn = document.getElementById('unlock-btn');
                    btn.innerHTML = "Unlock Secret 🎁";
                    btn.classList.add('active');
                    btn.disabled = false;
                    gameActive = false;
                }
            };
        }

        function openPhoto() {
            const frame = document.getElementById('photo-frame');
            frame.style.display = 'block';
            setTimeout(() => frame.classList.add('open'), 10);
            document.getElementById('unlock-btn').style.display = 'none';
            
            for(let i=0; i<60; i++) {
                setTimeout(() => createEmoji(['💖', '💝', '✨', '🎀', '🌸'], 'falling-item'), i * 40);
            }

            // AUTO DIMINISH: Wait 5 seconds, then close the photo automatically
            setTimeout(() => {
                frame.classList.add('diminish');
                setTimeout(() => {
                    frame.style.display = 'none';
                    triggerWordDrop(); // Directly start words after 1 second of photo fading
                }, 1000);
            }, 5000); 
        }

        function triggerWordDrop() {
            const container = document.getElementById('final-message-container');
            const words = finalLine.split(" ");
            words.forEach((word, index) => {
                const span = document.createElement('span');
                span.innerText = word;
                span.className = 'word';
                container.appendChild(span);
                setTimeout(() => {
                    span.classList.add('drop');
                    if(index === words.length - 1) {
                        setTimeout(applyGoldAndBlackout, 1500);
                    }
                }, index * 400); 
            });
        }

        function applyGoldAndBlackout() {
            const spans = document.querySelectorAll('.word');
            spans.forEach(s => s.classList.add('gold-sparkle'));
            
            setTimeout(() => {
                document.getElementById('black-out').style.opacity = "1";
                const audio = document.getElementById('bgMusic');
                const fadeAudio = setInterval(() => {
                    if (audio.volume > 0.05) {
                        audio.volume -= 0.05;
                    } else {
                        audio.pause();
                        clearInterval(fadeAudio);
                    }
                }, 200);
            }, 3000);
        }

        function calculateDays() {
            const start = new Date("2025-08-23");
            const diff = Math.ceil(Math.abs(new Date() - start) / (1000 * 60 * 60 * 24));
            document.getElementById('daysCount').innerHTML = `<b>${diff}</b> days and counting...`;
        }

        function createEmoji(list, className) {
            const e = document.createElement('div');
            e.innerHTML = list[Math.floor(Math.random() * list.length)];
            e.className = className;
            e.style.left = Math.random() * 100 + "vw";
            e.style.fontSize = (Math.random() * 20 + 20) + "px";
            e.style.animationDuration = (Math.random() * 2 + 2) + "s";
            document.body.appendChild(e);
            setTimeout(() => e.remove(), 4000);
        }
    </script>
</body>
</html>
